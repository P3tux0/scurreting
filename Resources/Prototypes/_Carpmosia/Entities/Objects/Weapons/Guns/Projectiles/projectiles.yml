- type: entity
  parent: AnomalousParticleDelta
  id: AnomalousParticleGammaStrong
  name: gamma particles
  categories: [ HideSpawnMenu ]
  components:
  - type: PointLight
    enabled: true
    color: "#f41a1f"
    radius: 4.0
    energy: 14.0
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
      - state: magicm_red
        shader: unshaded
  - type: Projectile
    impactEffect: BulletImpactEffectKinetic
    damage:
      types:
        Heat: 20
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000
  - type: BatterySelfRecharger
    autoRechargeRate: 1000
  - type: Gun
    fireRate: 16
    minAngle: 1
    maxAngle: 360
    selectedMode: SemiAuto
    availableModes:
      - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser.ogg
  - type: BatteryAmmoProvider
    proto: BulletMiningChaos
    fireCost: 1
  - type: AutoShootGun
    enabled: true
  - type: RepeatingTrigger
    delay: 0.5

- type: entity
