- type: entity
  name: emergency laser
  parent: [BaseLaserRifle, BaseGunWieldable, BaseSecurityContraband]
  id: WeaponEmergencyLaser
  description: Bulky last generation laser carbines. The last refuge of a desperate spaceman.
  components:
  - type: Item
    size: Ginormous
  - type: Sprite
    sprite: _Carpmosia/Objects/Weapons/Guns/Battery/emergency_laser.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: PointLight
    radius: 1.5
    energy: 14
    color: "#ff0043"
    mask: /Textures/Effects/LightMasks/double_cone.png
  - type: RotatingLight
    speed: 180

- type: entity
  name: xenoborg laser repeater
  parent: [WeaponLaserCannon, BaseXenoborgContraband]
  id: WeaponLaserRepeaterXenoborg
  components:
  - type: BatterySelfRecharger
    autoRechargeRate: 30
  - type: GunWieldBonus
    minAngle: 0
    maxAngle: 0
  - type: Gun
    fireRate: 6
    minAngle: 1
    maxAngle: 8
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Hits/laser3.ogg
  - type: MeleeWeapon
    attackRate: 1
    angle: 60
    animation: WeaponArcFist
    wideAnimationRotation: 45
    damage:
      types:
        Blunt: 15
  - type: AltFireMelee
    attackType: Heavy
  - type: BatteryAmmoProvider
    proto: XenoLightLaser
    fireCost: 25
  - type: Sprite
    sprite: _Carpmosia/Objects/Weapons/Guns/Battery/xenoborg_laser_repeater.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-unshaded-4
      map: [ "enum.GunVisualLayers.MagUnshaded" ]

- type: entity
  name: phototherapy laser
  parent: [BaseWeaponPowerCellSmall, BaseGunWieldable, BaseSyndicateContraband]
  id: WeaponPhotoTherapyLaser
  description: A Highly experimental handheld medication device that uses concentrated light to evoke fast regeneration.
  components:
  - type: Item
    size: Huge
    shape:
    - 0,0,4,1
  - type: Sprite
    sprite: _Carpmosia/Objects/Weapons/Guns/Battery/phototherapy_laser.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: false
  - type: Appearance
  - type: Clothing
    sprite: Objects/Weapons/Guns/Battery/phototherapy_laser.rsi
  - type: Gun
    fireRate: 2
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Hits/laser_sear_wall.ogg
  - type: BatteryAmmoProvider
    proto: RejuvenationLaser
    fireCost: 25
  - type: Tag
    tags:
    - TurretCompatibleWeapon
